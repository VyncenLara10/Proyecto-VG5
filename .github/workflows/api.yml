name: api
on:
  push:
    branches: [feature/vyncen-integration]
    paths: ['apps/api/**']

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas
        run: |
          pip install -r apps/api/requirements.txt
          cd apps/api && pytest
      - id: meta
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
      - name: Actualizar tag en el manifiesto
        run: |
          sed -i 's|newTag: .*|newTag: "${{ steps.meta.outputs.short }}"|' k8s/apps/api/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "ci: api image ${{ steps.meta.outputs.short }} [skip ci]" || exit 0
          git push