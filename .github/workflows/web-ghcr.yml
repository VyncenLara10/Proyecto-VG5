name: Web GHCR

on:
  push:
    branches: [feature/roger-web, feature/vyncen-integration, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombre de imagen en minúsculas
        id: image
        run: |
          OWNER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER_REPO}/web" >> "$GITHUB_OUTPUT"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

      - name: Actualizar imagen web en GitOps
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${{ github.sha }}"

          sed -E -i "s|(^[[:space:]]*image:[[:space:]]*)ghcr\.io/[^[:space:]]+/web:[^[:space:]]+|\1${IMAGE}|" k8s/apps/web/deployment.yaml

          grep -Fq "$IMAGE" k8s/apps/web/deployment.yaml || exit 1

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/apps/web/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "ci(web): update image [skip ci]"
            git push
          fi
