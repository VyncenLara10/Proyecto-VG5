apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelab-database
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VyncenLara10/Proyecto-VG5.git
    targetRevision: main
    path: k8s/apps/database
  destination:
    server: https://kubernetes.default.svc
    namespace: kubelab-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
