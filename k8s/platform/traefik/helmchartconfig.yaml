apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      annotations:
        metallb.io/loadBalancerIPs: "192.168.50.240"
      spec:
        type: LoadBalancer
      ipFamilyPolicy: SingleStack
      ipFamilies:
        - IPv4
