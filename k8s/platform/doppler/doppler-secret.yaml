# Doppler → Kubernetes (PREPARADO, NO APLICAR aún)
#
# Este manifiesto solo funciona después de instalar el operador de Doppler:
#   helm repo add doppler https://helm.doppler.com && helm repo update
#   helm install --generate-name doppler/doppler-kubernetes-operator
# Instrucciones completas: docs/plataforma/doppler.md
#
# Requiere además el secret con el token de Doppler (nunca se guarda en Git):
#   kubectl create secret generic doppler-token-secret \
#     --namespace doppler-operator-system \
#     --from-literal=serviceToken=<TOKEN-DE-DOPPLER>
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: apps
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: kubelab
  config: dev
  managedSecret:
    name: doppler-apps
    namespace: apps
    type: Opaque
