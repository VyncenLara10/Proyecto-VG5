apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/vyncenlara10/proyecto-vg5/web:sha-0903014a5d79fafa0a7271e628a794cf3c2aef65
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_UPSTREAM
              value: "http://api.kubelab-dev.svc.cluster.local:80"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
