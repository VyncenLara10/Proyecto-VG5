apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelab-web
  namespace: apps
  labels:
    app: kubelab-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubelab-web
  template:
    metadata:
      labels:
        app: kubelab-web
    spec:
      containers:
        - name: web
          image: ghcr.io/vyncenlara10/proyecto-vg5/web:sha-edaa917
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: kubelab-web-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
