apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`app.grupo5.lab`) && PathPrefix(`/products`)
      kind: Rule
      priority: 100
      services:
        - name: api
          port: 80

    - match: Host(`app.grupo5.lab`) && Path(`/health`)
      kind: Rule
      priority: 100
      services:
        - name: api
          port: 80

    - match: Host(`app.grupo5.lab`)
      kind: Rule
      priority: 1
      services:
        - name: web
          port: 80
