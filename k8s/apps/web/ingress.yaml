apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubelab-web
  namespace: kubelab-dev
  labels:
    app: kubelab-web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubelab-web
                port:
                  number: 80
