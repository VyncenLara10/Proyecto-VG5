apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
    app: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      annotations:
        kubelab.dev/db-url-refresh: "1"
        secrets.doppler.com/reload: "true"
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/vyncenlara10/proyecto-vg5-api:0000000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
            - name: CORS_ORIGINS
              value: "http://app.grupo5.lab"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
