apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kubelab-grafana
  namespace: kube-system
spec:
  chart: grafana
  repo: https://grafana-community.github.io/helm-charts
  version: 14.4.0
  targetNamespace: kubelab-monitoring
  valuesContent: |-
    replicas: 1

    service:
      type: ClusterIP

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi

    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 1Gi

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://kubelab-prometheus-server.kubelab-monitoring.svc.cluster.local
            isDefault: true
            editable: false
