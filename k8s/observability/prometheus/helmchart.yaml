apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kubelab-prometheus
  namespace: kube-system
spec:
  chart: prometheus
  repo: https://prometheus-community.github.io/helm-charts
  version: 29.42.0
  targetNamespace: kubelab-monitoring
  createNamespace: true
  valuesContent: |-
    alertmanager:
      enabled: false

    prometheus-pushgateway:
      enabled: false

    server:
      retention: 2d
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi

      persistentVolume:
        enabled: true
        storageClass: local-path
        size: 4Gi

      service:
        type: ClusterIP

    extraScrapeConfigs: |
      - job_name: kubelab-api
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets:
              - api.kubelab-dev.svc.cluster.local:80
            labels:
              namespace: kubelab-dev
              app: api
