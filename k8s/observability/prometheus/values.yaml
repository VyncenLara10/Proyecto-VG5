alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  retention: 2d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 4Gi

  service:
    type: ClusterIP

extraScrapeConfigs: |
  - job_name: kubelab-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - api.kubelab-dev.svc.cluster.local:80
        labels:
          namespace: kubelab-dev
          app: api
