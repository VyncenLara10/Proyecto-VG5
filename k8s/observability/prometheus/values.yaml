alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  retention: 2d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

  persistentVolume:
    enabled: true
    storageClass: nfs-client
    size: 4Gi

  service:
    type: ClusterIP
